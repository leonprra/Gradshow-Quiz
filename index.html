<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  
  <!-- CRITICAL: This viewport meta tag is essential for mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <title>What Tool Are You? - Designer Quiz</title>
  
  <!-- p5.js library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden; /* Prevent scrolling on mobile */
      position: fixed; /* Prevent bounce/overscroll on iOS */
      -webkit-overflow-scrolling: touch;
    }
    
    body {
      margin: 0;
      padding: 0;
      /* Prevent text selection and callouts on mobile */
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    
    canvas {
      display: block;
      /* Prevent touch gestures on canvas */
      touch-action: none;
      -ms-touch-action: none;
    }
  </style>
</head>
<body>
  <!-- Your p5.js sketch will be injected here -->
  <script src="sketch.js"></script>
</body>
</html>
